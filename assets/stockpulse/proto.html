<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StockPulse · 产品原型 v1.0</title>
<style>
:root{
  --bg:#06070B;
  --sc:#0A0C13;          /* screen bg */
  --card:#131824;
  --card2:#1A2131;
  --line:rgba(255,255,255,.075);
  --line2:rgba(255,255,255,.13);
  --txt:#EDF1F8;
  --mut:#8C94A8;
  --faint:#5A6478;
  --up:#2BD9A0;
  --dn:#FF4A5B;
  --brand:#7AA2FF;
  --brand2:#9B8CFF;
  --lv1:#FFC24B;   /* 关注 -5% */
  --lv2:#FF9445;   /* 预警 -10% */
  --lv3:#FF4A5B;   /* 止损 -15% */
  --lv4:#2BD9A0;   /* 止盈 +20% */
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  --num:"SF Pro Display",-apple-system,"DIN Alternate","PingFang SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:var(--num);letter-spacing:-.2px}

/* ============ STAGE (standalone) ============ */
.stage{min-height:100vh;padding:44px 28px 70px;
  background:
    radial-gradient(60% 40% at 18% 0%,rgba(122,162,255,.10),transparent 62%),
    radial-gradient(50% 40% at 88% 8%,rgba(255,74,91,.08),transparent 65%),
    var(--bg);}
.stage-hd{max-width:1500px;margin:0 auto 34px;display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.stage-hd .lg{display:flex;align-items:center;gap:12px}
.stage-hd .lg svg{width:34px;height:34px}
.stage-hd h1{font-size:25px;font-weight:600;letter-spacing:.5px}
.stage-hd h1 em{font-style:normal;color:var(--brand)}
.stage-hd .vs{font-size:11px;letter-spacing:2px;color:var(--faint);padding:4px 9px;border:1px solid var(--line2);border-radius:5px}
.stage-hd p{font-size:12.5px;color:var(--mut);line-height:1.9;margin-left:auto;max-width:520px;text-align:right}
.stage-hd p b{color:var(--txt);font-weight:500}
.rowlab{max-width:1500px;margin:0 auto 14px;display:flex;align-items:center;gap:14px}
.rowlab i{font-style:normal;width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand)}
.rowlab b{font-size:12px;font-weight:500;letter-spacing:3px;color:#cfd6e6}
.rowlab s{flex:1;height:1px;background:var(--line);text-decoration:none}
.rowlab em{font-style:normal;font-size:10.5px;letter-spacing:2px;color:var(--faint)}
.screens{max-width:1500px;margin:0 auto 52px;display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start}
.slot{width:330px}
.slot .cap{margin-top:15px;font-size:11.5px;color:var(--mut);letter-spacing:.4px;line-height:1.75}
.slot .cap b{display:block;color:#e6eaf3;font-weight:500;font-size:12.5px;margin-bottom:4px;letter-spacing:1px}
.slot .cap b i{font-style:normal;color:var(--brand);margin-right:7px;font-size:10px}

/* ============ PHONE ============ */
.phone{position:relative;width:330px;height:714px;border-radius:46px;padding:9px;
  background:linear-gradient(160deg,#31384a,#0d1017 42%,#262c3b);
  box-shadow:0 34px 70px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.06);}
.phone::after{content:'';position:absolute;left:50%;translate:-50% 0;bottom:15px;width:104px;height:4px;
  border-radius:4px;background:rgba(255,255,255,.34);z-index:20;pointer-events:none}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--sc);
  display:flex;flex-direction:column}
.island{position:absolute;top:9px;left:50%;translate:-50% 0;width:88px;height:25px;border-radius:14px;background:#000;z-index:15}

/* embed mode: no phone frame */
body.embed{background:var(--sc)}
body.embed .stage{display:none}
.embedwrap{display:none}
body.embed .embedwrap{display:block;width:100%;height:100vh}
body.embed .embedwrap .screen{border-radius:0;height:100vh}
body.embed .island{display:none}
body.embed .statusbar{padding-top:10px}
/* shot mode: single phone, exact size, for asset capture */
body.shot{background:transparent}
body.shot .stage{display:none}
body.shot .embedwrap{display:block;width:330px;height:714px;padding:0}

/* ============ STATUS BAR ============ */
.statusbar{flex:0 0 auto;height:46px;padding:15px 24px 0;display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;font-weight:600;letter-spacing:.2px}
.statusbar .r{display:flex;align-items:center;gap:5px}
.statusbar svg{display:block}

/* ============ NAV BAR ============ */
.nav{flex:0 0 auto;padding:4px 18px 10px;display:flex;align-items:center;gap:10px}
.nav .bk{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--card);color:var(--mut)}
.nav h2{font-size:17px;font-weight:600;letter-spacing:.3px}
.nav .sm{font-size:10.5px;color:var(--faint);letter-spacing:1px;margin-top:1px}
.nav .sp{margin-left:auto;display:flex;gap:8px}
.nav .ico{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--card);color:var(--mut)}
.nav .ico.dot{position:relative}
.nav .ico.dot::after{content:'';position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;
  background:var(--dn);box-shadow:0 0 7px var(--dn)}

/* ============ BODY SCROLL ============ */
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 18px}
.screen[data-sc="detail"] .body,.screen[data-sc="report"] .body{padding-bottom:36px}
.body::-webkit-scrollbar{width:0}

/* ============ TABBAR ============ */
.tabbar{flex:0 0 auto;height:66px;display:flex;padding:7px 6px 0;
  background:rgba(10,12,19,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:9.5px;letter-spacing:.5px;padding-top:5px;position:relative}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--brand)}
.tab .bdg{position:absolute;top:2px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--dn);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;letter-spacing:0}

/* ============ COMMON BITS ============ */
.mkt{display:flex;gap:6px;margin:0 0 10px}
.mk{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.mk .t{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mut);letter-spacing:.6px}
.mk .t i{width:5px;height:5px;border-radius:50%;background:var(--faint);font-style:normal;flex:0 0 auto}
.mk.live .t i{background:var(--up);box-shadow:0 0 8px var(--up);animation:bp 1.8s infinite}
.mk.pre .t i{background:var(--lv1)}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.3}}
.mk .v{margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.2px}
.mk.live .v{color:var(--up)}
.mk.pre .v{color:var(--lv1)}
.mk.off .v{color:var(--faint)}

.hero{position:relative;overflow:hidden;border-radius:17px;padding:14px 16px 10px;margin-bottom:11px;
  background:linear-gradient(158deg,#1B2233,#11151F 60%);border:1px solid var(--line)}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(85% 70% at 88% 0%,rgba(255,74,91,.14),transparent 62%)}
.hero .lb{position:relative;font-size:10.5px;color:var(--mut);letter-spacing:1.6px;display:flex;align-items:center;gap:7px}
.hero .lb em{font-style:normal;margin-left:auto;font-size:9.5px;color:var(--faint);letter-spacing:.8px}
.hero .big{position:relative;margin-top:5px;font-family:var(--num);font-size:30px;font-weight:600;letter-spacing:-.8px;line-height:1.1}
.hero .big s{text-decoration:none;font-size:17px;opacity:.6;margin-right:2px}
.hero .kv{position:relative;display:flex;gap:20px;margin-top:9px}
.hero .kv div span{display:block;font-size:9.5px;color:var(--faint);letter-spacing:1px}
.hero .kv div b{display:block;margin-top:3px;font-family:var(--num);font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.hero .spark{position:relative;margin:9px -16px -10px;height:46px}
.hero .spark svg{width:100%;height:100%;display:block}

.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mut)}

.strip{display:flex;align-items:center;gap:9px;padding:9px 12px;margin-bottom:11px;border-radius:13px;
  background:linear-gradient(96deg,rgba(255,74,91,.14),rgba(255,148,69,.05));border:1px solid rgba(255,74,91,.25)}
.strip .pl{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(255,74,91,.2);flex:0 0 auto}
.strip .tx{flex:1;font-size:11.5px;line-height:1.55;color:#e9edf6}
.strip .tx b{color:var(--dn);font-weight:600}
.strip .go{font-size:11px;color:var(--mut)}

.sect{display:flex;align-items:center;gap:9px;margin:13px 2px 8px}
.sect b{font-size:12.5px;font-weight:600;letter-spacing:.8px}
.sect s{flex:1;height:1px;background:var(--line);text-decoration:none}
.sect em{font-style:normal;font-size:10px;color:var(--faint);letter-spacing:1px}

/* holding row */
.hold{position:relative;border-radius:14px;background:var(--card);border:1px solid var(--line);
  padding:10px 12px 9px;margin-bottom:8px;overflow:hidden}
.hold::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faint)}
.hold.l1::before{background:var(--lv1)}
.hold.l2::before{background:var(--lv2)}
.hold.l3::before{background:var(--lv3)}
.hold.l4::before{background:var(--lv4)}
.hold .r1{display:flex;align-items:flex-start;gap:8px}
.hold .nm{font-size:14px;font-weight:600;letter-spacing:.3px}
.hold .cd{font-size:9.5px;color:var(--faint);letter-spacing:.8px;margin-top:3px;display:flex;align-items:center;gap:6px}
.hold .mb{padding:1px 5px;border-radius:4px;font-size:8.5px;letter-spacing:.5px;
  background:rgba(122,162,255,.13);color:var(--brand)}
.hold .mb.hk{background:rgba(155,140,255,.14);color:var(--brand2)}
.hold .mb.us{background:rgba(43,217,160,.12);color:var(--up)}
.hold .pr{margin-left:auto;text-align:right}
.hold .pr b{display:block;font-family:var(--num);font-size:16px;font-weight:600;letter-spacing:-.3px}
.hold .pr span{display:block;font-family:var(--num);font-size:11px;margin-top:2px}
.hold .r2{display:flex;align-items:center;gap:7px;margin-top:10px}
.hold .bar{position:relative;flex:1;height:5px;border-radius:3px;overflow:hidden;
  background:linear-gradient(90deg,var(--lv3) 0%,var(--lv2) 22%,var(--lv1) 40%,#2A3245 52%,#2A3245 62%,rgba(43,217,160,.5) 100%)}
.hold .bar i{position:absolute;top:-3px;width:2px;height:11px;background:#fff;border-radius:2px;
  box-shadow:0 0 7px rgba(255,255,255,.85);font-style:normal}
.hold .bar u{position:absolute;top:-1px;width:1px;height:7px;background:rgba(255,255,255,.35);text-decoration:none}
.hold .pnl{font-family:var(--num);font-size:11.5px;font-weight:600;min-width:62px;text-align:right}
.hold .tag{position:absolute;top:11px;right:13px;display:none}
.hold .r3{display:flex;gap:12px;margin-top:8px;font-size:9.5px;color:var(--faint);letter-spacing:.4px}
.hold .r3 b{color:var(--mut);font-weight:400;font-family:var(--num)}
.lvbdg{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:9.5px;letter-spacing:.5px;font-weight:500}
.lvbdg i{width:5px;height:5px;border-radius:50%;font-style:normal}
.b1{background:rgba(255,194,75,.13);color:var(--lv1)}.b1 i{background:var(--lv1)}
.b2{background:rgba(255,148,69,.14);color:var(--lv2)}.b2 i{background:var(--lv2)}
.b3{background:rgba(255,74,91,.15);color:var(--lv3)}.b3 i{background:var(--lv3)}
.b4{background:rgba(43,217,160,.13);color:var(--lv4)}.b4 i{background:var(--lv4)}
.b5{background:rgba(122,162,255,.13);color:var(--brand)}.b5 i{background:var(--brand)}
.b0{background:rgba(255,255,255,.05);color:var(--mut)}.b0 i{background:var(--faint)}

/* ============ ALERTS ============ */
.chips{display:flex;gap:6px;overflow-x:auto;padding:3px 0 11px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:20px;font-size:11px;letter-spacing:.5px;color:var(--mut);
  background:var(--card);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:rgba(122,162,255,.15);border-color:rgba(122,162,255,.4);color:var(--brand)}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:12px;width:1px;background:var(--line2)}
.al{position:relative;margin-bottom:11px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:12px 13px}
.al::before{content:'';position:absolute;left:-21px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--faint);
  border:2px solid var(--sc)}
.al.l1::before{background:var(--lv1);box-shadow:0 0 9px var(--lv1)}
.al.l2::before{background:var(--lv2);box-shadow:0 0 9px var(--lv2)}
.al.l3::before{background:var(--lv3);box-shadow:0 0 9px var(--lv3)}
.al.l4::before{background:var(--lv4);box-shadow:0 0 9px var(--lv4)}
.al.l5::before{background:var(--brand);box-shadow:0 0 9px var(--brand)}
.al .ah{display:flex;align-items:center;gap:8px}
.al .ah b{font-size:13px;font-weight:600;letter-spacing:.3px}
.al .ah em{font-style:normal;margin-left:auto;font-size:9.5px;color:var(--faint);font-family:var(--num)}
.al .ab{margin-top:8px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.028);
  display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.al .ab div span{font-size:9px;color:var(--faint);letter-spacing:.8px}
.al .ab div b{display:block;font-family:var(--num);font-size:12.5px;font-weight:600;margin-top:2px}
.al .af{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:10px;color:var(--faint);letter-spacing:.4px}
.al .af .cd2{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;
  background:rgba(255,255,255,.05);color:var(--mut);font-family:var(--num);font-size:9.5px}
.al .af .mrg{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;
  background:rgba(122,162,255,.1);color:var(--brand);font-size:9.5px}
.al .sug{margin-top:8px;padding-left:9px;border-left:2px solid rgba(255,255,255,.13);font-size:10.5px;color:var(--mut);line-height:1.7}
.al .sug b{color:#dfe4ef;font-weight:500}

/* ============ DETAIL ============ */
.dhead{padding:2px 3px 12px}
.dhead .p{display:flex;align-items:flex-end;gap:10px}
.dhead .p b{font-family:var(--num);font-size:35px;font-weight:600;letter-spacing:-1px;line-height:1}
.dhead .p span{font-family:var(--num);font-size:13px;font-weight:600;padding-bottom:4px}
.dhead .sub{margin-top:7px;display:flex;gap:9px;font-size:10px;color:var(--faint);letter-spacing:.5px}
.chart{position:relative;border-radius:15px;background:var(--card);border:1px solid var(--line);padding:12px 0 8px;margin-bottom:11px}
.chart svg{width:100%;display:block}
.chart .lg2{display:flex;gap:11px;padding:0 13px 4px;flex-wrap:wrap}
.chart .lg2 span{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--mut);letter-spacing:.4px}
.chart .lg2 i{width:11px;height:2px;border-radius:2px;font-style:normal}
.ruler{border-radius:15px;background:var(--card);border:1px solid var(--line);padding:13px 13px 11px;margin-bottom:11px}
.ruler .rh{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.ruler .rh b{font-size:12px;font-weight:600;letter-spacing:.6px}
.ruler .rh em{font-style:normal;margin-left:auto;font-size:9.5px;color:var(--faint);letter-spacing:.8px}
.scale{position:relative;height:7px;border-radius:4px;margin:0 4px 30px;
  background:linear-gradient(90deg,#FF4A5B 0%,#FF9445 24%,#FFC24B 43%,#2A3245 54%,#2A3245 63%,rgba(43,217,160,.45) 88%,#2BD9A0 100%)}
.scale u{position:absolute;top:-4px;width:1px;height:15px;background:rgba(255,255,255,.28);text-decoration:none}
.scale u b{position:absolute;top:19px;left:50%;translate:-50% 0;font-size:8.5px;color:var(--faint);white-space:nowrap;font-family:var(--num);font-weight:400}
.scale .me{position:absolute;top:-8px;translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:0}
.scale .me i{width:3px;height:23px;border-radius:3px;background:#fff;box-shadow:0 0 11px rgba(255,255,255,.8);font-style:normal}
.scale .me b{margin-top:3px;font-family:var(--num);font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;
  padding:1px 6px;border-radius:5px;background:rgba(255,74,91,.9)}
.thr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.thr .dt{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.thr .nm2{font-size:11.5px;letter-spacing:.4px;width:52px}
.thr .sl{position:relative;flex:1;height:3px;border-radius:3px;background:#232A3A}
.thr .sl s{position:absolute;left:0;top:0;bottom:0;border-radius:3px;text-decoration:none}
.thr .sl i{position:absolute;top:50%;translate:-50% -50%;width:15px;height:15px;border-radius:50%;background:#fff;
  box-shadow:0 2px 7px rgba(0,0,0,.6);font-style:normal}
.thr .vl{font-family:var(--num);font-size:12px;font-weight:600;width:46px;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.cell{border-radius:12px;background:var(--card);border:1px solid var(--line);padding:10px 12px}
.cell span{font-size:9.5px;color:var(--faint);letter-spacing:.8px}
.cell b{display:block;margin-top:4px;font-family:var(--num);font-size:15px;font-weight:600;letter-spacing:-.2px}

/* ============ WATCHLIST ============ */
.wgrp{margin-bottom:6px}
.wrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);margin-bottom:7px;position:relative;overflow:hidden}
.wrow.hit{border-color:rgba(122,162,255,.34);background:linear-gradient(96deg,rgba(122,162,255,.09),var(--card) 55%)}
.wrow .wi{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.05);color:var(--mut);flex:0 0 auto;letter-spacing:-.3px}
.wrow .wn b{display:block;font-size:13px;font-weight:600;letter-spacing:.3px}
.wrow .wn span{display:block;font-size:9.5px;color:var(--faint);margin-top:2px;letter-spacing:.6px}
.wrow .wp{margin-left:auto;text-align:right}
.wrow .wp b{display:block;font-family:var(--num);font-size:14px;font-weight:600}
.wrow .wp s{display:block;text-decoration:none;font-family:var(--num);font-size:11px;margin-top:2px}
.wrow .wt{flex:0 0 auto;padding:2px 6px;border-radius:5px;font-size:8.5px;letter-spacing:.4px;
  background:rgba(255,255,255,.05);color:var(--faint);font-family:var(--num)}

/* ============ ASK / CHAT ============ */
.chat{display:flex;flex-direction:column;gap:11px;padding-top:6px}
.bub{max-width:80%;padding:10px 13px;border-radius:15px;font-size:12.5px;line-height:1.7;letter-spacing:.2px}
.bub.me{align-self:flex-end;background:linear-gradient(140deg,#7AA2FF,#6A7FF5);color:#fff;border-bottom-right-radius:5px}
.bub.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.bot .bh{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--brand);letter-spacing:1px;margin-bottom:7px}
.qcard{align-self:flex-start;max-width:88%;border-radius:15px;border-bottom-left-radius:5px;background:var(--card);
  border:1px solid var(--line);overflow:hidden}
.qcard .qh{padding:9px 13px;background:rgba(122,162,255,.08);display:flex;align-items:center;gap:7px;
  font-size:10.5px;letter-spacing:1px;color:var(--brand)}
.qcard .ql{padding:4px 13px 11px}

function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}

function toPath(a,w,h,lo,hi,pad=0){const n=a.length;

  </div>
</div>
${tabbar('me')}`;

/* ==================== RENDER ==================== */
const ORDER=[
 ['home'  ,'脉搏 · 首页','一屏回答「我现在亏多少、要不要管」：三市场时钟、总资产脉搏线、按偏离度排序的持仓、四档预警色条',0],
 ['home'  ,'脉搏 · 持仓列表','每一行都自带一条「四档标尺」：白色游标是当前偏离度，落在红/橙/黄/绿哪一段，不用读数字也知道',330],
 ['alert' ,'预警中心','把脚本里的 5 类推送变成可回溯的时间轴，冷却状态、合并折叠、闪崩并联全部显性化',0],
 ['detail','个股详情 · 阈值可视化','原型的核心屏：把 −5 / −10 / −15 / +20 四条阈值直接画进分时图，价格落在哪一档一眼可见',0],
 ['detail','个股详情 · 阈值调节','四档阈值逐只可调，底部保留该标的的完整预警履历与冷却状态',300],
 ['watch' ,'自选 · 只盯异动','观察池刻意不显示盈亏，只保留「突破价位」与「单日异动阈值」两种触发',0],
 ['ask'   ,'问它 · 对话式查询','继承飞书机器人的模糊匹配能力（铜 → 有色金属 ETF），并明确划出「不做基本面归因」的能力边界',0],
 ['report','收盘日报','三个市场各自的收盘场次，跨市场持仓降透明度显示，底部给一句人话总结',0],
 ['me'    ,'规则与数据源健康','把双数据源容灾、限流退避、冷却与静默这些「看不见的工程」翻译成用户能读懂的状态',0],
];
const GROUPS=[
 ['01　核心链路','HOME → ALERT → DETAIL','日常主路径：看一眼 → 被提醒 → 决定要不要动'],
 ['02　深度与观察','DETAIL · WATCH · ASK','把「调规则」「还没买的」「想问的」，收进三个语义不同的容器'],
 ['03　日报与信任','REPORT · SETTINGS','低频，但决定这个 App 值不值得托付的两屏'],
];
function build(){
 const p=new URLSearchParams(location.search);
 const emb=p.get('embed'), sc=p.get('screen'), shot=p.get('shot');
 if(shot){
   document.body.classList.add('shot');
   document.getElementById('embedwrap').innerHTML=
     `<div class="phone" style="width:330px;height:714px"><div class="island"></div><div class="screen" data-sc="${shot}">${(S[shot]||S.home)()}</div></div>`;
   bind();
   const sy=+(p.get('scroll')||0);
   if(sy){const b=document.querySelector('.body');if(b)b.scrollTop=sy}
   return;
 }
 if(emb){
   document.body.classList.add('embed');
   document.getElementById('embedwrap').innerHTML=`<div class="screen" data-sc="${sc||'home'}">${(S[sc]||S.home)()}</div>`;
   bind();
   const sy=+(p.get('scroll')||0);
   if(sy){const b=document.querySelector('.body');if(b)b.scrollTop=sy}
   return;
 }
 const m=document.getElementById('mount');
 let html='',i=0;
 const slices=[ORDER.slice(0,4),ORDER.slice(4,7),ORDER.slice(7,9)];
 slices.forEach((sl,gi)=>{
   html+=`<div class="rowlab"><i></i><b>${GROUPS[gi][0]}</b><em>${GROUPS[gi][1]}</em><s></s><em>${GROUPS[gi][2]}</em></div><div class="screens">`;
   sl.forEach(([k,t,d,sy])=>{
     html+=`<div class="slot"><div class="phone"><div class="island"></div><div class="screen" data-sc="${k}" data-sy="${sy||0}">${S[k]()}</div></div>
       <div class="cap"><b><i>◆</i>${String(++i).padStart(2,'0')} ${t}</b>${d}</div></div>`;
   });
   html+=`</div>`;
 });
 m.innerHTML=html;
 document.querySelectorAll('.slot .screen').forEach(s=>{
   const sy=+(s.getAttribute('data-sy')||0);
   if(sy){const b=s.querySelector('.body');if(b)b.scrollTop=sy}
 });
 bind();
}
function bind(){
 document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',e=>{
   e.stopPropagation();
   const k=el.getAttribute('data-go');
   const sc=el.closest('.screen'); if(!sc||!S[k])return;
   sc.innerHTML=S[k]();sc.setAttribute('data-sc',k);
   const b=sc.querySelector('.body'); if(b)b.scrollTop=0;
   bind();
 }));
 document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',e=>{
   e.stopPropagation();
   c.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
 }));
 document.querySelectorAll('.sw').forEach(s=>s.addEventListener('click',e=>{e.stopPropagation();s.classList.toggle('on')}));
}
build();
</script>
</body>
